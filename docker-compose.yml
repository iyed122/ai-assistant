services:

  # ── Neo4j 5 + APOC (knowledge graph + vector index) ──────────────────────────
  neo4j:
    image: neo4j:5.20
    container_name: ai-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      # Password comes from .env — compose reads it automatically.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "1g"
      NEO4J_server_memory_heap_max__size: "4g"
      NEO4J_server_memory_pagecache_size: "2g"
    volumes:
      # Fresh isolated named volume by default. Point NEO4J_DATA_PATH at an
      # existing Neo4j data dir in .env to reuse your own graph + embeddings.
      - ${NEO4J_DATA_PATH:-neo4j_data}:/data
    healthcheck:
      # Wait until Bolt actually accepts queries, not just until the container starts.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [ai_net]

  # ── MongoDB (chat history, evaluation, training metadata) ────────────────────
  mongo:
    image: mongo:7
    container_name: ai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks: [ai_net]

  # ── Ollama (local LLM server: generation + the RAGAS judge) ──────────────────
  # Containerised so that `docker compose up` really does bring up the whole
  # stack. Set OLLAMA_HOST_DOCKER in .env to point the backend at a host install
  # instead (e.g. http://host.docker.internal:11434) if you prefer to run the
  # model server outside Docker.
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [ai_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── One-shot: pull the models the stack needs, then exit ─────────────────────
  # Keeps the stack plug-and-run on a clean machine. Re-running is cheap:
  # `ollama pull` is a no-op once the blobs are in the named volume.
  model-init:
    image: ollama/ollama:latest
    container_name: ai-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c",
      "ollama pull ${OLLAMA_MODEL:-qwen3:8b} && ollama pull ${JUDGE_MODEL:-qwen2.5:7b-instruct}"]
    restart: "no"
    networks: [ai_net]

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - MONGO_URI=${MONGO_URI_DOCKER:-mongodb://mongo:27017/}
      # Ollama is containerised (service `ollama`). Override OLLAMA_HOST_DOCKER
      # in .env to use a host install instead.
      - OLLAMA_HOST=${OLLAMA_HOST_DOCKER:-http://ollama:11434}
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./mlruns:/app/mlruns
    depends_on:
      neo4j:
        condition: service_healthy
      mongo:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ai_net]
    # Optional NVIDIA GPU for in-container embedding/rerank. On a CPU-only host,
    # remove this block (or add a docker-compose.cpu.yml override) to start the stack.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── React frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-frontend
    ports:
      - "3000:80"
    depends_on: [backend]
    restart: unless-stopped
    networks: [ai_net]

volumes:
  neo4j_data:
  mongo_data:
  hf_cache:
  ollama_models:

networks:
  ai_net:
